name: Release

# Tagged release of the prebuilt core libraries (hiddify-lib-* artifacts the
# app downloads via `make *-prepare` / CORE_URL).
#
# Two ways to run:
# - push a tag v*.*.* (classic);
# - workflow_dispatch with tag-name (fork repos do not always deliver push
#   events for tags, so the manual path is the reliable one).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Release tag to build ("draft" = rolling draft build)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag-name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: ${{ inputs.tag-name || github.ref_name }}
      # *.dev tags build against the dev channel; everything else is prod.
      channel: ${{ endsWith(inputs.tag-name || github.ref_name, 'dev') && 'dev' || 'prod' }}
